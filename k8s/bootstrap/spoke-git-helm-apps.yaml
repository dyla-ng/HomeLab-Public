apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-git-helm-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=default"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: ssh://git@ssh.github.com:443/homelab-user/homelab-k8s.git
        revision: HEAD
        files:
          - path: k8s/apps/*/overlays/spoke/git-helm.yaml
  template:
    metadata:
      name: '{{.appName}}-spoke'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{.syncWave}}'
    spec:
      project: default
      sources:
        - repoURL: '{{.repoURL}}'
          targetRevision: '{{.targetRevision}}'
          path: '{{.chartPath}}'
          helm:
            releaseName: '{{.appName}}'
            valueFiles:
              - '$values/{{.valuesFile}}'
        - repoURL: ssh://git@ssh.github.com:443/homelab-user/homelab-k8s.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://10.100.30.10:6443
        namespace: '{{.namespace}}'
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .metadata.labels
            - .status
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
  templatePatch: |
    {{- if .serverSideApply }}
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
    {{- end }}

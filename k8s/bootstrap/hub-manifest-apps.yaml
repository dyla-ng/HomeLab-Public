apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-manifest-apps
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: ssh://git@ssh.github.com:443/homelab-user/homelab-k8s.git
        revision: HEAD
        files:
          - path: k8s/apps/*/overlays/hub/manifest.yaml
  template:
    metadata:
      name: '{{appName}}-hub'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{syncWave}}'
    spec:
      project: default
      source:
        repoURL: ssh://git@ssh.github.com:443/homelab-user/homelab-k8s.git
        targetRevision: HEAD
        path: 'k8s/apps/{{path[2]}}/overlays/hub'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

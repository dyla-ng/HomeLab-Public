apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crossplane-system-policy
  namespace: crossplane-system
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    # 1. Allow all intra-namespace traffic (e.g crossplane components talking to database)
    - fromEndpoints:
        - matchLabels: {}
    # 2. Allow ingress from Kubernetes API server for webhook calls on port 9443
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # 1. Allow all intra-namespace traffic
    - toEndpoints:
        - matchLabels: {}
    # 2. Allow DNS traffic to CoreDNS (kube-dns in kube-system)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # 3. Allow egress to Kubernetes API server via kube-apiserver entity
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # 4. Allow egress to Vault in vault namespace
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 5. Allow egress to Proxmox API (R730PVE)
    - toCIDRSet:
        - cidr: 10.100.10.75/32
      toPorts:
        - ports:
            - port: "8006"
              protocol: TCP
    # 6. Allow egress to external registries and Github (for Crossplane packages)
    - toFQDNs:
        - matchPattern: "*.upbound.io"
        - matchPattern: "*.docker.io"
        - matchPattern: "*.docker.com"
        - matchName: "ghcr.io"
        - matchPattern: "*.github.com"
        - matchPattern: "*.githubusercontent.com"
        - matchPattern: "*.cloudflare.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
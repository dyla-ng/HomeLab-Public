apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: vault-reviewer
    patch: |
      - op: replace
        path: /metadata/name
        value: vault-reviewer-hub

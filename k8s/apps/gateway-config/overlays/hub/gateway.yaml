apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hub-gateway
  namespace: gateway-system
  annotations:
    cert-manager.io/cluster-issuer: vault-issuer
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: hub-gateway-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hub-gateway-tls
  namespace: gateway-system
spec:
  secretName: hub-gateway-tls
  commonName: argocd.mgmt.lab.example.com
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
  dnsNames:
  - argocd.mgmt.lab.example.com
  - vault.mgmt.lab.example.com
  duration: 2160h
  renewBefore: 360h
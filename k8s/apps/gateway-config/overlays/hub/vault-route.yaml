apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-route
  namespace: vault
spec:
  parentRefs:
  - name: hub-gateway
    namespace: gateway-system
  hostnames:
  - vault.mgmt.lab.example.com
  rules:
  - backendRefs:
    - name: vault
      port: 8200
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: vault-tls-policy
  namespace: vault
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: vault
  validation:
    caCertificateRefs:
    - group: ""
      kind: Secret
      name: vault-tls
    hostname: vault.lab.example.com
apiVersion: v1
kind: Service
metadata:
  name: fleet-redis
  namespace: fleet
spec:
  ports:
  - name: redis
    port: 6379
  selector:
    app: fleet-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleet-redis
  namespace: fleet
spec:
  serviceName: fleet-redis
  replicas: 1
  selector:
    matchLabels:
      app: fleet-redis
  template:
    metadata:
      labels:
        app: fleet-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - sh
        - -c
        - "exec redis-server --requirepass \"$REDIS_PASSWORD\""
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fleet-secrets
              key: redis-password
        ports:
        - name: redis
          containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 100Mi
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: zfs-iscsi
      resources:
        requests:
          storage: 2Gi

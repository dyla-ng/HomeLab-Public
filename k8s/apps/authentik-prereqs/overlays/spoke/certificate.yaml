apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik-tls
  namespace: authentik
spec:
  secretName: authentik-tls
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
  commonName: authentik.lab.example.com
  dnsNames:
    - authentik.lab.example.com
  duration: 2160h
  renewBefore: 360h
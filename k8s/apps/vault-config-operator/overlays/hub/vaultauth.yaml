apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: vault-config-operator
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: vault-config-operator
spec:
  vaultConnectionRef: vso/vault-hub
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-vault-config-operator-role
    serviceAccount: vault-auth
    tokenExpirationSeconds: 3600

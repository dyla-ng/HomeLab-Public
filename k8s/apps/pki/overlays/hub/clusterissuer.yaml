apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    server: https://vault.lab.example.com:32200
    path: pki_int/sign/internal-homelab
    caBundle: REDACTED
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-role
        serviceAccountRef:
          name: cert-manager
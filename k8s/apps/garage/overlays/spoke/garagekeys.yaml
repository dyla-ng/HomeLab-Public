apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: velero-key
  namespace: garage
spec:
  clusterRef:
    name: garage
    namespace: garage
  name: velero-key
  neverExpires: true
  bucketPermissions:
    - bucketRef:
        name: velero
        namespace: garage
      read: true
      write: true
      owner: false
  secretTemplate:
    name: garage-velero-credentials

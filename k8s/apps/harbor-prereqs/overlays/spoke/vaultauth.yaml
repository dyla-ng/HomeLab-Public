apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: harbor
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: harbor
spec:
  vaultConnectionRef: vso/vault-hub
  method: jwt
  mount: jwt-spoke
  jwt:
    role: vso-harbor-role
    serviceAccount: vault-auth
    tokenExpirationSeconds: 3600
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: harbor-secrets
  namespace: harbor
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: homelab/harbor
  refreshAfter: 1h
  destination:
    name: harbor-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: false
      templates:
        HARBOR_ADMIN_PASSWORD:
          text: '{{ index .Secrets "admin-password" }}'
        secretKey:
          text: '{{ index .Secrets "secret-key" }}'
        secret:
          text: '{{ index .Secrets "core-secret" }}'
        JOBSERVICE_SECRET:
          text: '{{ index .Secrets "jobservice-secret" }}'
        REGISTRY_HTTP_SECRET:
          text: '{{ index .Secrets "registry-secret" }}'
        password:
          text: '{{ index .Secrets "database-password" }}'
        csrf-key:
          text: '{{ index .Secrets "csrf-key" }}'
        oidc_client_secret:
          text: '{{ index .Secrets "oidc-client-secret" }}'
        POSTGRESQL_PASSWORD:
          text: '{{ index .Secrets "database-password" }}'
        CONFIG_OVERWRITE_JSON:
          text: |
            {
              "auth_mode": "oidc_auth",
              "oidc_name": "Authentik",
              "oidc_endpoint": "https://authentik.lab.example.com/application/o/harbor/",
              "oidc_client_id": "harbor",
              "oidc_client_secret": "{{ index .Secrets "oidc-client-secret" }}",
              "oidc_groups_claim": "groups",
              "oidc_scope": "openid,profile,email,groups",
              "oidc_admin_group": "homelab-admins@kanidm.lab.example.com",
              "oidc_verify_cert": true,
              "oidc_auto_onboard": true,
              "oidc_user_claim": "preferred_username"
            }
apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: apps-cilium
  namespace: default
spec:
  clusterSelector:
    matchLabels:
      cni-cluster: apps
  repoURL: https://helm.cilium.io/
  chartName: cilium
  version: "1.19.5"
  namespace: kube-system
  options:
    waitForJobs: true
    wait: true
    timeout: 10m
  valuesTemplate: |
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445
    operator:
      replicas: 1
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    bgpControlPlane:
      enabled: true
    hubble:
      enabled: false
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-harbor-db-password
  annotations:
    policies.kyverno.io/title: "Sync Harbor Database Password"
    policies.kyverno.io/description: >
      The Harbor helm chart generates its own harbor-database and harbor-core
      Secrets with POSTGRES_PASSWORD/POSTGRESQL_PASSWORD from a plain values.yaml
      string (no existingSecret support). This policy mutates those chart-generated
      Secrets on admission to inject the real password from the harbor-secrets Secret,
      keeping all credentials sourced from Vault with nothing sensitive in Git.
spec:
  admission: true
  background: true
  validationFailureAction: Audit
  rules:
  - name: inject-postgres-password
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
          - Secret
          names:
          - harbor-database
          namespaces:
          - harbor
    context:
    - name: vaultPassword
      apiCall:
        method: GET
        urlPath: "/api/v1/namespaces/harbor/secrets/harbor-secrets"
        jmesPath: "data.password"
    mutate:
      patchStrategicMerge:
        data:
          POSTGRES_PASSWORD: "{{ vaultPassword }}"
  - name: inject-core-postgres-password
    skipBackgroundRequests: true
    match:
      any:
      - resources:
          kinds:
          - Secret
          names:
          - harbor-core
          namespaces:
          - harbor
    context:
    - name: vaultPassword
      apiCall:
        method: GET
        urlPath: "/api/v1/namespaces/harbor/secrets/harbor-secrets"
        jmesPath: "data.password"
    mutate:
      patchStrategicMerge:
        data:
          POSTGRESQL_PASSWORD: "{{ vaultPassword }}"
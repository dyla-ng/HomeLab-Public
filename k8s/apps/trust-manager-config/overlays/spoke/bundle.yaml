apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: homelab-root-ca
spec:
  sources:
    - secret:
        name: root-ca
        key: ca.crt
    - configMap:
        name: intermediate-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        homelab.example.com/inject-ca: enabled
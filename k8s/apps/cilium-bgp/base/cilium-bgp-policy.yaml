apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: dynamic-pool
spec:
  allowFirstLastIPs: "No"
  disabled: false
  blocks:
    - cidr: 10.100.50.0/24
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: lb-advertisement
  labels:
    advertise: "bgp"
spec:
  advertisements:
    - advertisementType: "Service"
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels: {}
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: opnsense-peer-config
spec:
  timers:
    holdTimeSeconds: 90
    keepAliveTimeSeconds: 30
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: "bgp"
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: opnsense-bgp-cluster-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: "instance-65030"
      localASN: 65030
      peers:
        - name: "opnsense-router"
          peerASN: 65000
          peerAddress: "10.100.30.1"
          peerConfigRef:
            name: "opnsense-peer-config"
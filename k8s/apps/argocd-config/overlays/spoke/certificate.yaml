apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls
  namespace: argocd
spec:
  secretName: argocd-tls
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
  commonName: argocd.lab.example.com
  dnsNames:
    - argocd.lab.example.com
  duration: 2160h
  renewBefore: 360h
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: hub-root-app
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: argoproj.io
    jqPathExpressions:
    - .metadata.finalizers
    kind: Application
  project: default
  source:
    directory:
      recurse: true
    path: k8s/bootstrap
    repoURL: ssh://git@ssh.github.com:443/homelab-user/homelab-k8s.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - RespectIgnoreDifferences=true

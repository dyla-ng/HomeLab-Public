# Kickstart file for AlmaLinux 9
text
skipx

# License agreement
eula --agreed

# System authorization information
authselect select minimal

# Use CDROM installation media
cdrom

# System bootloader configuration
bootloader --append="crashkernel=auto" --location=mbr

# Clear the Master Boot Record
zerombr

# Partition clearing information
clearpart --all --initlabel

# Automatically create partitions
autopart --type=lvm

# System keyboard
keyboard --vckeymap=us --xlayouts=us

# System language
lang en_US.UTF-8

# Network information
network --bootproto=dhcp --device=link --activate

# Root password (temporary, will be overridden by cloud-init)
rootpw --plaintext almalinux

# System timezone
timezone UTC --utc

# Firewall configuration
firewall --enabled --ssh

# Reboot after installation
reboot

# Packages to install
%packages
@core
tar
curl
sudo
-biosdevname
-open-vm-tools
%end

# Post-install script
%post --log=/var/log/kickstart-post.log

# Wait for internet connectivity to install extra packages (up to 45 seconds)
echo "==> Waiting for network connectivity..."
for i in {1..45}; do
  if curl -s -I https://repo.almalinux.org &>/dev/null; then
    echo "==> Network is active."
    break
  fi
  sleep 1
done

# Install cloud-init and qemu-guest-agent from online repositories
echo "==> Installing cloud-init and qemu-guest-agent..."
dnf install -y cloud-init qemu-guest-agent

# Enable guest agent and cloud-init services
systemctl enable cloud-init
systemctl enable qemu-guest-agent

# Permit root login with password over SSH temporarily for Packer
mkdir -p /etc/ssh/sshd_config.d
cat <<EOF > /etc/ssh/sshd_config.d/01-permitrootlogin.conf
PermitRootLogin yes
PasswordAuthentication yes
EOF

# Clean up SSH host keys so they are unique per clone
rm -f /etc/ssh/ssh_host_*_key*

# Clear machine-id so systemd gets unique DHCP client-IDs on clone
rm -f /etc/machine-id
touch /etc/machine-id
%end
